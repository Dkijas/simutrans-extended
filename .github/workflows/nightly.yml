name: nightly
# LAB ONLY - not part of the change under review.
# Upstream also runs on a schedule (cron '0 2 * * *').  No timer fires
# during the rehearsal: every run is started by hand.
on:
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Determine the latest successful commit
      - uses: actions/checkout@v4
      - name: Get all git tags
        run: git fetch --prune --unshallow --tags
      - name: Get latest successful commit hash
        id: last_successful_commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_json=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=master&status=success&per_page=1")
          latest_sha=$(echo "$run_json" | jq -r '.workflow_runs[0].head_sha // empty')
          run_id=$(echo "$run_json" | jq -r '.workflow_runs[0].id // empty')
          if [[ -z "$latest_sha" ]]; then
            echo "::error::No successful ci.yml run found on master"
            exit 1
          fi
          echo "commit_hash=$latest_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # Check for updates
      - name: Get Nightly hash
        env:
          LATEST_SHA: ${{ steps.last_successful_commit.outputs.commit_hash }}
        run: |
          nightly_sha=$(git rev-parse Nightly 2>/dev/null || echo none)
          latest_sha=$LATEST_SHA
          latest_short_sha=$(git rev-parse --short "$latest_sha")
          outdated=$( [[ $nightly_sha != $latest_sha ]] && echo true || echo false)

          echo "latest_sha=$latest_sha" >> "$GITHUB_ENV"
          echo "latest_short_sha=$latest_short_sha" >> "$GITHUB_ENV"
          echo "outdated=$outdated" >> "$GITHUB_ENV"

          [[ $outdated == true ]] &&\
            echo "Deploy Nightly #$latest_short_sha (Commit: $latest_sha)" ||\
            echo "Nightly #$latest_short_sha is up to date. Skipping following tasks"

      #TODO If the nightly tag is up-to-date but there is no release (delete manually?) We won't create a new one.
      # LAB ONLY - upstream this step is:
      #
      #   - uses: ncipollo/release-action@v1
      #     with:
      #       allowUpdates: true
      #       artifactErrorsFailBuild: true
      #       commit: "${{ env.latest_sha }}"
      #       name: "Nightly #${{ env.latest_short_sha }}"
      #       removeArtifacts: false
      #       tag: "Nightly"
      #       token: ${{ secrets.GITHUB_TOKEN }}
      #
      # That action returns 403 "Resource not accessible by integration" in
      # this fork, while the same GITHUB_TOKEN performs every underlying REST
      # call by hand (POST /releases 201, PATCH 200, DELETE 204, tag ref PATCH
      # 200). The only endpoint the token cannot reach here is
      # GET /immutable-releases, which such an action must consult.
      #
      # It is not a defect in the change under review: ncipollo v1.21.0 is six
      # months old and jamespetts/simutrans-extended ran the identical @v1
      # successfully the day before this rehearsal. This replacement exists
      # only so the rest of the nightly can be exercised here, and it must not
      # reach the production patch.
      - name: Release files
        if: env.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_SHA: ${{ env.latest_sha }}
          SHORT_SHA: ${{ env.latest_short_sha }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh release view Nightly --repo "$repo" >/dev/null 2>&1; then
            # LAB ONLY: modifying an EXISTING release returns 403 in this
            # fork, and inconsistently - a raw PATCH on one release id
            # succeeded at 05:49 and gh release edit on another failed at
            # 05:55, with the same token and Contents: write throughout.
            # Creating a release, moving the tag ref and uploading assets
            # all work here. The title and target are cosmetic for the
            # rehearsal, so a refusal is logged and the run continues:
            # everything downstream only needs the release to exist.
            # Upstream keeps ncipollo and does not hit this.
            echo "updating the existing Nightly release"
            if ! gh release edit Nightly --repo "$repo" \
                 --title "Nightly #$SHORT_SHA" --target "$LATEST_SHA"; then
              echo "::warning::could not edit the release in this fork (403);"
              echo "::warning::continuing - the release exists, which is all"
              echo "::warning::the rest of the rehearsal needs."
            fi
          else
            echo "creating the Nightly release"
            gh release create Nightly --repo "$repo" \
              --title "Nightly #$SHORT_SHA" --target "$LATEST_SHA" \
              --notes "Laboratory rehearsal release. Not a distribution."
          fi
          gh release view Nightly --repo "$repo" --json name,targetCommitish \
            --jq '"  now: \(.name) at \(.targetCommitish)"'

      # The part of removeArtifacts worth keeping: an asset whose name this
      # workflow no longer produces should not sit on the release for ever.
      # Retiring a name is a deliberate act, so the list is explicit and
      # anything absent from it is removed.
      - name: Remove release assets this workflow no longer produces
        if: env.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          keep="linux.zip linux-sdl2.zip
                windows.zip windows-sdl2.zip
                macos.zip macos-sdl2.zip macos-intel.zip macos-sdl2-intel.zip
                macos-signed.txt
                simutrans-extended.zip"
          removed=0
          while read -r name; do
            [ -n "$name" ] || continue
            if grep -qx -- "$name" <<<"$(tr ' ' '\n' <<<"$keep" | sed '/^$/d')"; then
              continue
            fi
            echo "removing obsolete release asset: $name"
            gh release delete-asset Nightly "$name" \
              --repo "${{ github.repository }}" --yes
            removed=$((removed + 1))
          done < <(gh release view Nightly --repo "${{ github.repository }}" \
                     --json assets --jq '.assets[].name')
          echo "obsolete assets removed: $removed"
      # LAB ONLY - upstream this is actions/github-script@v7 calling
      # github.rest.git.updateRef, and it works there. In this fork it hits
      # the same inconsistent 403 as the release edit, so the refusal is
      # logged instead of fatal and the tag is positioned by hand before a
      # rehearsal run. The publish job still checks the tag, which is the
      # thing that actually matters.
      - name: Move the Nightly tag
        if: env.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_SHA: ${{ env.latest_sha }}
        run: |
          set -uo pipefail
          if gh api --method PATCH \
               "repos/${{ github.repository }}/git/refs/tags/Nightly" \
               -f sha="$LATEST_SHA" -F force=true --jq '.object.sha'; then
            echo "Nightly tag now at $LATEST_SHA"
          else
            echo "::warning::could not move the Nightly tag in this fork (403)."
            echo "::warning::It is positioned by hand for the rehearsal; the"
            echo "::warning::publish job still checks it, which is the point."
          fi
    outputs:
      latest_sha: ${{ env.latest_sha }}
      run_id: ${{ steps.last_successful_commit.outputs.run_id }}
      outdated: ${{ env.outdated }}

  deploy-bin:
    runs-on: ${{ matrix.runner }}
    # LAB ONLY - disabled for the rehearsal.
    # Linux and Windows publication is out of scope for the rehearsal.
    # (upstream: if: needs.check-updates.outputs.outdated == 'true')
    if: false
    needs: check-updates
    permissions:
      contents: write
      actions: read
    strategy:
      matrix:
        include:
        # SDL3 is the default: these feed the canonical linux/windows/macos.zip assets
        - os: linux
          runner: ubuntu-latest
          backend: sdl3
          zip_name: linux.zip
          game_artifact: simutrans-linux-sdl3
          server_artifact: simutrans-linux-posix
          makeobj_artifact: makeobj-linux
          nettool_artifact: nettool-linux
        - os: windows
          runner: ubuntu-latest
          suffix: .exe
          backend: sdl3
          zip_name: windows.zip
          game_artifact: simutrans-windows-sdl3
          server_artifact: simutrans-windows-posix
          makeobj_artifact: makeobj-windows
          nettool_artifact: nettool-windows
        # macOS is NOT in this matrix any more.  It is built, signed with a
        # Developer ID, notarized, stapled and published by the sign-macos job
        # below, which calls .github/workflows/macos-sign-notarize.yml.
        #
        # It is not merely "the same packaging plus a signature".  The macOS
        # entries here consumed ci.yml's artifacts, and those are arm64 only
        # (macos-latest is an arm64 image) and declare a minimum of macOS 26.0,
        # because nothing in ci.yml pins a deployment target.  The signed path
        # builds from source on pinned runner images so that both
        # architectures exist and the floor is a decision rather than an
        # accident, and it produces an application bundle with the game data
        # beside it instead of four bare executables.
        #
        # SDL2 remains available under secondary asset names
        - os: linux
          runner: ubuntu-latest
          backend: sdl2
          zip_name: linux-sdl2.zip
          game_artifact: simutrans-linux-sdl2
          server_artifact: simutrans-linux-posix
          makeobj_artifact: makeobj-linux
          nettool_artifact: nettool-linux
        - os: windows
          runner: ubuntu-latest
          suffix: .exe
          backend: sdl2
          zip_name: windows-sdl2.zip
          game_artifact: simutrans-windows-sdl2
          server_artifact: simutrans-windows-posix
          makeobj_artifact: makeobj-windows
          nettool_artifact: nettool-windows
    steps:
      - name: Get artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.check-updates.outputs.run_id }}
        run: |
          curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > /tmp/artifact-list.json
          for name in ${{ matrix.game_artifact }} ${{ matrix.server_artifact }} ${{ matrix.makeobj_artifact }} ${{ matrix.nettool_artifact }}; do
            artifact_id=$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .id' /tmp/artifact-list.json)
            if [[ -z "$artifact_id" || "$artifact_id" == "null" ]]; then
              echo "::error::Artifact $name not found in CI run $RUN_ID"
              exit 1
            fi
            mkdir -p "./artifacts/$name"
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" -o "/tmp/$name.zip" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip"
            unzip -q "/tmp/$name.zip" -d "./artifacts/$name"
          done

      - name: Prepare Deployment
        run: |
          mkdir ./${{matrix.os}}
          cp ./artifacts/${{matrix.game_artifact}}/simutrans-extended${{matrix.suffix}} ./${{matrix.os}}/simutrans-extended${{matrix.suffix}}
          cp ./artifacts/${{matrix.server_artifact}}/simutrans-extended${{matrix.suffix}} ./${{matrix.os}}/simutrans-extended-server${{matrix.suffix}}
          cp ./artifacts/${{matrix.makeobj_artifact}}/makeobj-extended${{matrix.suffix}} ./${{matrix.os}}/makeobj-extended${{matrix.suffix}}
          cp ./artifacts/${{matrix.nettool_artifact}}/nettool-extended${{matrix.suffix}} ./${{matrix.os}}/nettool-extended${{matrix.suffix}}
      - run: zip -r ./${{ matrix.zip_name }} ./${{matrix.os}}/

      - name: Deploy
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./${{ matrix.zip_name }}
          tag: Nightly
          overwrite: true
          file_glob: true

  # The macOS downloads: built from source, signed with a Developer ID,
  # notarized, stapled, and attached to this same Nightly release.
  #
  # It is called with the commit check-updates chose and the CI run that made
  # that choice legitimate, so the project's existing policy about what is fit
  # to publish still decides WHICH commit; the called workflow only decides
  # whether that commit can be signed and shipped.
  #
  # Deliberately not in deploy-package's `needs`: when the notary service
  # rejects or stalls there is no new macOS download that night, and that must
  # not stop simutrans-extended.zip, the Linux and Windows assets or the
  # paksets from going out.  The previous signed macOS archives stay on the
  # release untouched - see the removeArtifacts note in check-updates.
  #
  # It runs unattended: the macos-signing environment must have no required
  # reviewers, or every night would wait for a human.
  sign-macos:
    name: macOS (signed)
    needs: check-updates
    if: needs.check-updates.outputs.outdated == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/macos-sign-notarize.yml
    with:
      sha: ${{ needs.check-updates.outputs.latest_sha }}
      ci_run_id: ${{ needs.check-updates.outputs.run_id }}
      publish: true
    secrets: inherit

  update-paks:
    runs-on: ubuntu-latest
    # LAB ONLY - disabled for the rehearsal.
    # must never be able to dispatch into jamespetts/simutrans-pak128.britain.
    if: false
    needs: check-updates #paksets pulling makeobj directly from the artifacts, no need to wait for deploy-bin
    strategy:
      matrix:
        include:
          - owner: jamespetts
            repo: simutrans-pak128.britain
            ref: master
            workflow_file_name: deploy-nightly.yml
            token: CI_TOKEN
#         - owner: Flemmbrav
#           repo: Pak192.Comic
#           ref: Extended
#           workflow_file_name: deploy-nightly.yml
#           github_token: ${{ secrets.CI_TOKEN }}

    steps:
      - name: Trigger deploy-nightly in the pakset repo and wait
        env:
          CI_TOKEN: ${{ secrets[matrix.token] }}
          LATEST_SHA: ${{ needs.check-updates.outputs.latest_sha }}
        run: |
          if [[ -z "$CI_TOKEN" ]]; then
            echo "::error::Secret ${{ matrix.token }} is not set; cannot trigger the pakset deployment"
            exit 1
          fi
          api="https://api.github.com/repos/${{ matrix.owner }}/${{ matrix.repo }}"
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          payload=$(jq -n --arg ref "${{ matrix.ref }}" --arg repo "${{ github.repository }}" --arg sha "$LATEST_SHA" \
            '{ref: $ref, inputs: {simutrans_repository: $repo, simutrans_sha: $sha}}')
          curl -sf -X POST \
            -H "Authorization: Bearer $CI_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/actions/workflows/${{ matrix.workflow_file_name }}/dispatches" \
            -d "$payload"
          echo "Dispatched ${{ matrix.workflow_file_name }} on ${{ matrix.owner }}/${{ matrix.repo }} (${{ matrix.ref }}) for simutrans-extended commit $LATEST_SHA, waiting for completion"
          for i in $(seq 1 80); do
            sleep 15
            state=$(curl -sf -H "Authorization: Bearer $CI_TOKEN" \
              "$api/actions/workflows/${{ matrix.workflow_file_name }}/runs?per_page=5" \
              | jq -r --arg ts "$ts" '[.workflow_runs[] | select(.created_at >= $ts)][0] | "\(.status)/\(.conclusion)"')
            case "$state" in
              completed/success)
                echo "Pakset deployment succeeded"
                exit 0
                ;;
              completed/*)
                echo "::error::Pakset deployment finished with: $state"
                exit 1
                ;;
            esac
          done
          echo "::error::Timed out waiting for the pakset deployment"
          exit 1

  # TODO: check for changes only deploy if simutrans binaries or at least one of the paksets has changed.
  deploy-package:
    runs-on: ubuntu-latest
    # LAB ONLY - disabled for the rehearsal.
    # depends on the Linux and Windows assets this rehearsal does not produce.
    if: false
    needs: [check-updates, deploy-bin, update-paks]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-updates.outputs.latest_sha }}

      #Get binaries and paksets from the Nightly releases
      - name: Fetch release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          get_asset() {
            repo="$1"
            name="$2"
            out="$3"
            asset_url=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/tags/Nightly" \
              | jq -r --arg name "$name" '.assets[] | select(.name == $name) | .url')
            if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
              echo "::error::Asset $name not found in the Nightly release of $repo"
              exit 1
            fi
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$out" "$asset_url"
          }
          get_asset "${{ github.repository }}" "linux.zip" "linux.zip"
          get_asset "${{ github.repository }}" "windows.zip" "windows.zip"
          get_asset "jamespetts/simutrans-pak128.britain" "pak128.britain-ex-nightly.zip" "pak128.britain-ex-nightly.zip"

      - run: |
          unzip ./windows.zip -d .
          mv ./windows/* ./simutrans
          rm -r ./windows
          
          unzip ./linux.zip -d .
          mv ./linux/* ./simutrans
          rm -r ./linux

      #TODO pak192.comic
      - run: unzip pak128.britain-ex-nightly.zip -d ./simutrans/

      - run: zip -r ./simutrans-extended.zip ./simutrans/

      - name: Deploy
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./simutrans-extended.zip
          tag: Nightly
          overwrite: true
