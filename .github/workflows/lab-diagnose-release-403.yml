#
# LAB ONLY - not part of the change under review. Delete before delivery.
#
# ncipollo/release-action@v1 fails with
#   Error 403: Resource not accessible by integration
# on both create and update, while the job's GITHUB_TOKEN reports
# Contents: write and a hand-rolled POST/PATCH to the same endpoints
# succeeds (201/200).  So it is something in the action's payload, not the
# permission.
#
# This sends create payloads of increasing completeness and reports the HTTP
# status of each, so the offending field names itself instead of being
# guessed at.
#
name: LAB diagnose release 403

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Which field is refused?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          created=""

          try() {
            # try <label> <json>
            local label=$1 body=$2 code id
            code=$(printf '%s' "$body" | curl -s -o /tmp/out.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases" -d @-)
            printf '%-52s %s\n' "$label" "$code"
            if [ "$code" -ge 400 ]; then
              jq -r '"      " + (.message // "?")' < /tmp/out.json
            else
              id=$(jq -r .id < /tmp/out.json)
              curl -s -o /dev/null -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/releases/$id"
            fi
            curl -s -o /dev/null -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/git/refs/tags/lab-probe-tag"
          }

          T='"tag_name":"lab-probe-tag","target_commitish":"master"'

          echo "=== create, one field added at a time"
          try "minimal"                          "{$T}"
          try "+ name"                           "{$T,\"name\":\"probe\"}"
          try "+ body"                           "{$T,\"name\":\"probe\",\"body\":\"\"}"
          try "+ draft/prerelease"               "{$T,\"name\":\"probe\",\"body\":\"\",\"draft\":false,\"prerelease\":false}"
          try "+ generate_release_notes:false"   "{$T,\"name\":\"probe\",\"draft\":false,\"prerelease\":false,\"generate_release_notes\":false}"
          try "+ make_latest:legacy"             "{$T,\"name\":\"probe\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"legacy\"}"
          try "+ make_latest:true"               "{$T,\"name\":\"probe\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"true\"}"
          try "+ immutable:false"                "{$T,\"name\":\"probe\",\"draft\":false,\"prerelease\":false,\"immutable\":false}"
          try "+ discussion_category_name:\"\""  "{$T,\"name\":\"probe\",\"draft\":false,\"prerelease\":false,\"discussion_category_name\":\"\"}"

          echo
          echo "=== what the repository says about releases"
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/immutable-releases" | jq . || true
          echo
          echo "=== and about discussions / features"
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO" \
            | jq '{has_discussions, has_issues, fork, archived, disabled}' || true
